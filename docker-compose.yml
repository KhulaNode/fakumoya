services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fakumoya
      POSTGRES_USER: fakumoya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - fakumoya-medusa-postgres-v2:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fakumoya -d fakumoya']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, yes]
    volumes:
      - fakumoya-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  medusa-migrate:
    build:
      context: .
      dockerfile: Dockerfile.medusa
    command: [npx, medusa, db:migrate]
    working_dir: /app/apps/backend
    env_file:
      - apps/backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  medusa:
    build:
      context: .
      dockerfile: Dockerfile.medusa
    working_dir: /app/apps/backend
    command: [npm, run, dev]
    env_file:
      - apps/backend/.env
    environment:
      HMR_PORT: "5173"
      HMR_BIND_HOST: 0.0.0.0
      HMR_HOST: localhost
      HMR_CLIENT_PORT: "5173"
    depends_on:
      medusa-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports:
      - "9000:9000"
      - "5173:5173"
    restart: unless-stopped

  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://localhost:9000}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
    env_file:
      - apps/storefront/.env.local
    depends_on:
      medusa: { condition: service_started }
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  fakumoya-medusa-postgres-v2:
  fakumoya-redis:
