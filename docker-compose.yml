services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: fakumoya
      POSTGRES_USER: fakumoya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - fakumoya-medusa-postgres-v2:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fakumoya -d fakumoya']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file:
      - .env
    command: [redis-server, --appendonly, yes]
    volumes:
      - fakumoya-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  medusa-migrate:
    build:
      context: .
      dockerfile: Dockerfile.medusa
    command: [npx, medusa, db:migrate]
    working_dir: /app/apps/backend
    env_file:
      - .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  medusa:
    build:
      context: .
      dockerfile: Dockerfile.medusa
    env_file:
      - .env
    depends_on:
      medusa-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    expose:
      - "9000"
    healthcheck:
      test: [CMD-SHELL, 'node -e "fetch(\"http://127.0.0.1:9000/health\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    volumes:
      - fakumoya-uploads:/app/apps/backend/.medusa/server/static

  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:?set NEXT_PUBLIC_MEDUSA_BACKEND_URL}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:?set NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?set NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-za}
    env_file:
      - .env
    depends_on:
      medusa: { condition: service_healthy }
    expose:
      - "8000"
    healthcheck:
      test: [CMD-SHELL, 'node -e "fetch(\"http://127.0.0.1:8000/robots.txt\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  fakumoya-medusa-postgres-v2:
  fakumoya-redis:
  fakumoya-uploads:
